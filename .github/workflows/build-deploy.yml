name: Build and Deploy

# CI -> GHCR -> SSH-pull pipeline for xmail.
#
# GitHub Actions owns the container lifecycle. Coolify/Traefik owns HTTP
# routing when the host has the `coolify` Docker network.
#
# The deploy uses a blue/green HTTP handoff:
#   1. Start xmail-next on the coolify network without host-published ports.
#   2. Health-check xmail-next inside the container.
#   3. Point Traefik's file-provider route at xmail-next.
#   4. Replace the host-published xmail container for 25/587/993.
#   5. Health-check xmail, point Traefik back at xmail, then remove xmail-next.
#
# HTTP stays served during the handoff. Mail ports still have a brief cutover
# because only one container can publish host ports 25/587/993 at a time.

on:
  push:
    # Only main deploys production. `dev` used to be here too, which meant any push to dev
    # rolled the single prod host — a footgun, since dev and main share one deploy target.
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/xmail
  HEALTH_CHECK_RETRIES: 12
  HEALTH_CHECK_INTERVAL: 5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get deploy metadata
        id: meta
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, hashlib
          from pathlib import Path
          import gzip, io, tarfile
          raw = Path('.github/scripts/deploy-xmail.sh').read_bytes()
          print('deploy_code_sha256='+hashlib.sha256(raw).hexdigest())
          bundle=io.BytesIO()
          with tarfile.open(fileobj=bundle,mode='w') as archive:
              for name in ['.github/scripts/deploy-xmail.sh','scripts/ops/prepare-xmail-owned-runtime-maintenance.py','scripts/ops/prepare-xmail-owned-pilot-rollout.py','scripts/ops/prepare-xmail-final-data-cutover.py','scripts/ops/xmail-database-rehearsal.sh']:
                  data=Path(name).read_bytes();info=tarfile.TarInfo(name);info.size=len(data);info.mode=0o600;archive.addfile(info,io.BytesIO(data))
          payload=gzip.compress(bundle.getvalue(),mtime=0)
          print('maintenance_code_b64='+base64.b64encode(payload).decode())
          print('maintenance_code_sha256='+hashlib.sha256(payload).hexdigest())
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_NAME=Xmail

      - name: Bound SSH payload before connecting
        # Every secret run_app_container() needs on the remote host is declared here and
        # forwarded by name via `envs:`, instead of being interpolated as `${{ secrets.X }}`
        # straight into the script body below. A raw `${{ }}` interpolation is a textual
        # substitution done BEFORE bash ever sees the line — a secret value containing a
        # quote or backtick would become executable shell (the same class of risk the
        # Telegram notification step below already avoids for commit messages). Referencing
        # `$X` inside the script instead lets bash's own quoting handle arbitrary secret
        # content safely.
        env: &xmail_deploy_environment
          XMAIL_DEPLOY_CODE_SHA256: ${{ steps.meta.outputs.deploy_code_sha256 }}
          XMAIL_MAINTENANCE_CODE_B64: ${{ steps.meta.outputs.maintenance_code_b64 }}
          XMAIL_MAINTENANCE_CODE_SHA256: ${{ steps.meta.outputs.maintenance_code_sha256 }}
          GITHUB_SOURCE_SHA: ${{ github.sha }}
          DEPLOY_VERSION: ${{ steps.meta.outputs.version }}
          DEPLOYED_AT: ${{ steps.meta.outputs.deployed_at }}
          GHCR_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DB_LIVENESS_INTERVAL_MS: ${{ vars.DB_LIVENESS_INTERVAL_MS }}
          DB_LIVENESS_PROBE_TIMEOUT_MS: ${{ vars.DB_LIVENESS_PROBE_TIMEOUT_MS }}
          DB_LIVENESS_EXIT_AFTER_MS: ${{ vars.DB_LIVENESS_EXIT_AFTER_MS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          OUTLOOK_TOKEN_ENCRYPTION_KEY: ${{ secrets.OUTLOOK_TOKEN_ENCRYPTION_KEY }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          APP_COMPANY_NAME: ${{ secrets.APP_COMPANY_NAME }}
          APP_APPLICATION_NAME: ${{ secrets.APP_APPLICATION_NAME }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          XMAIL_SERVICE_KEY: ${{ secrets.XMAIL_SERVICE_KEY }}
          XMAIL_SERVICE_USER_ID: ${{ secrets.XMAIL_SERVICE_USER_ID }}
          XMAIL_SERVICE_ORGANIZATION_ID: ${{ secrets.XMAIL_SERVICE_ORGANIZATION_ID }}
          XPHERE_EVENTS_URL: ${{ secrets.XPHERE_EVENTS_URL }}
          XPHERE_EVENTS_API_KEY: ${{ secrets.XPHERE_EVENTS_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          XCRAPER_SERVICE_URL: ${{ secrets.XCRAPER_SERVICE_URL }}
          XCRAPER_SERVICE_KEY: ${{ secrets.XCRAPER_SERVICE_KEY }}
          PROSPECTING_DAILY_BUDGET_USD: ${{ secrets.PROSPECTING_DAILY_BUDGET_USD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -B scripts/ops/check-xmail-ssh-payload.py

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1.0.0
        env: *xmail_deploy_environment
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          # Single line, no spaces after commas — appleboy/ssh-action splits this on ","
          # without trimming, and a stray space would turn " SUPABASE_URL" into a lookup
          # for an env var that doesn't exist under that name.
          envs: XMAIL_DEPLOY_CODE_SHA256,XMAIL_MAINTENANCE_CODE_B64,XMAIL_MAINTENANCE_CODE_SHA256,GITHUB_SOURCE_SHA,DEPLOY_VERSION,DEPLOYED_AT,GHCR_AUTH_TOKEN,GHCR_ACTOR,DB_LIVENESS_INTERVAL_MS,DB_LIVENESS_PROBE_TIMEOUT_MS,DB_LIVENESS_EXIT_AFTER_MS,IMAGE_NAME,HEALTH_CHECK_RETRIES,HEALTH_CHECK_INTERVAL,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,DATABASE_URL,DIRECT_URL,JWT_SECRET,ENCRYPTION_KEY,OUTLOOK_TOKEN_ENCRYPTION_KEY,MAIL_DOMAIN,APP_COMPANY_NAME,APP_APPLICATION_NAME,SMTP_PASS,SMTP_FROM,FRONTEND_URL,XMAIL_SERVICE_KEY,XMAIL_SERVICE_USER_ID,XMAIL_SERVICE_ORGANIZATION_ID,XPHERE_EVENTS_URL,XPHERE_EVENTS_API_KEY,APOLLO_API_KEY,XCRAPER_SERVICE_URL,XCRAPER_SERVICE_KEY,PROSPECTING_DAILY_BUDGET_USD,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_PUBLIC_BASE_URL,MONITOR_API_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            set -euo pipefail
            python3 -I - <<'XMAIL_DEPLOY_BOOTSTRAP_PY' | bash -s
            import base64,gzip,hashlib,io,os,sys,tarfile
            try:
                raw=base64.b64decode(os.environ['XMAIL_MAINTENANCE_CODE_B64'],validate=True)
                assert len(raw)<=262144 and hashlib.sha256(raw).hexdigest()==os.environ['XMAIL_MAINTENANCE_CODE_SHA256']
                unpacked=gzip.decompress(raw);assert len(unpacked)<=1048576
                names={'.github/scripts/deploy-xmail.sh','scripts/ops/prepare-xmail-owned-runtime-maintenance.py','scripts/ops/prepare-xmail-owned-pilot-rollout.py','scripts/ops/prepare-xmail-final-data-cutover.py','scripts/ops/xmail-database-rehearsal.sh'}
                with tarfile.open(fileobj=io.BytesIO(unpacked),mode='r:') as archive:
                    members=archive.getmembers()
                    assert len(members)==len(names) and {m.name for m in members}==names
                    assert all(m.isfile() and 0<m.size<196608 for m in members)
                    data=archive.extractfile('.github/scripts/deploy-xmail.sh').read()
                assert hashlib.sha256(data).hexdigest()==os.environ['XMAIL_DEPLOY_CODE_SHA256']
                sys.stdout.buffer.write(data)
            except Exception:
                print('Pinned deployment bundle refused; details suppressed.',file=sys.stderr);raise SystemExit(2)
            XMAIL_DEPLOY_BOOTSTRAP_PY
      # ── Deploy notification ────────────────────────────────────────────────
      # A failed deploy leaves production running the PREVIOUS image (the
      # rollout above rolls back), so nothing is broken and nothing external
      # notices — the uptime probe stays green. Without this, a failed deploy
      # is a red run in a list nobody reads, and the fix silently never ships.
      #
      # Credentials come from the admin panel, cached the same way the uptime
      # probe caches them: on a FAILED deploy the app may be unreachable, so a
      # live panel read cannot be relied on.
      - name: Restore cached alert credentials
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .alert-creds
          key: xmail-tg-creds-none
          restore-keys: |
            xmail-tg-creds-

      - name: Resolve alert credentials
        if: always()
        id: creds
        env:
          APP_URL: ${{ vars.APP_URL || 'https://mail.skale.club' }}
          MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
          FALLBACK_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FALLBACK_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/resolve-alert-credentials.sh

      # Commit metadata is passed through the ENVIRONMENT, never interpolated
      # into the script body. A ${{ }} expression inside `run:` is substituted
      # as text before bash parses the line, so a commit message containing a
      # quote or a backtick would become executable shell.
      - name: Notify Telegram of the deploy result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # First line only: a long body would push the useful part of the
          # alert past Telegram's fold.
          subject=$(printf '%s' "${COMMIT_MSG:-}" | head -n1)
          details="<code>${COMMIT_SHA:0:7}</code> by ${ACTOR:-unknown}\n${subject}\n\n${RUN_URL}"

          if [ "${JOB_STATUS}" = "success" ]; then
            bash scripts/telegram-notify.sh "🚀 <b>Xmail deploy OK</b>" "${details}"
          else
            bash scripts/telegram-notify.sh "🚨 <b>Xmail deploy FAILED</b>" \
              "${details}\n\nProduction is still running the previous image."
          fi
