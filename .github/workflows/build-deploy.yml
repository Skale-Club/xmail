name: Build and Deploy

# CI→GHCR→SSH-pull pipeline for skaleclub-mail.
#
# Unlike Coolify apps, skaleclub-mail runs directly on Hetzner via SSH
# (ports 25/587/993 need raw TCP, bypassing Traefik). The pattern is:
#   1. Build Docker image here in CI (off the VPS — avoids OOM on the 8GB box)
#   2. Push to GHCR
#   3. SSH into the server → docker pull → stop old container → run new one
#
# Required repo secrets (all already set):
#   HETZNER_HOST, HETZNER_SSH_KEY      — SSH access
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  — build-time (Vite inlines them)
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY  — runtime
#   DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, OUTLOOK_TOKEN_ENCRYPTION_KEY
#   MAIL_DOMAIN, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM
#   APP_COMPANY_NAME, APP_APPLICATION_NAME, FRONTEND_URL

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skale-club/skaleclub-mail
  HEALTH_CHECK_URL: http://localhost:9001/health
  HEALTH_CHECK_RETRIES: 12
  HEALTH_CHECK_INTERVAL: 5

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get deploy metadata
        id: meta
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # VITE_* are inlined into the client bundle at build time
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_NAME=Skale Club Mail

      - name: Deploy to Hetzner (pull prebuilt image + restart)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_NAME,HEALTH_CHECK_URL,HEALTH_CHECK_RETRIES,HEALTH_CHECK_INTERVAL
          script: |
            set -euo pipefail
            DEPLOY_VERSION="${{ steps.meta.outputs.version }}"
            DEPLOYED_AT="${{ steps.meta.outputs.deployed_at }}"

            echo "::group::🔑 Log in to GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            echo "::endgroup::"

            echo "::group::📦 Pull prebuilt image (no build on VPS)"
            docker pull "${IMAGE_NAME}:latest"
            docker tag  "${IMAGE_NAME}:latest" skaleclub-mail:latest
            docker tag  "${IMAGE_NAME}:latest" "skaleclub-mail:${DEPLOY_VERSION}"
            echo "::endgroup::"

            echo "::group::💾 Disk space check"
            DISK_FREE_KB=$(df / | awk 'NR==2 {print $4}')
            DISK_FREE_GB=$((DISK_FREE_KB / 1024 / 1024))
            echo "Free: ${DISK_FREE_GB}GB"
            if [ "$DISK_FREE_GB" -lt 2 ]; then
              echo "❌ Less than 2GB free — aborting"
              exit 1
            fi
            echo "✅ Disk OK"
            echo "::endgroup::"

            echo "::group::🚀 Restart container"
            # Save previous for rollback
            if docker images skaleclub-mail:latest --format "{{.ID}}" | grep -q .; then
              docker tag skaleclub-mail:latest skaleclub-mail:previous || true
            fi

            # Free mail ports from any conflicting container
            for PORT in 25 587 993; do
              CONFLICTING=$(docker ps -q --filter "publish=$PORT" 2>/dev/null || true)
              if [ -n "$CONFLICTING" ]; then
                echo "⚠️  Freeing port $PORT from: $CONFLICTING"
                echo "$CONFLICTING" | xargs -r docker stop || true
                echo "$CONFLICTING" | xargs -r docker rm -f || true
              fi
            done

            # Stop old container
            if docker ps -a --filter "name=^/skaleclub-mail$" --format "{{.ID}}" | grep -q .; then
              docker stop skaleclub-mail || true
              docker rm -f skaleclub-mail || true
            fi

            NETWORK_FLAG=""
            if docker network ls --format "{{.Name}}" | grep -qE "^coolify$"; then
              NETWORK_FLAG="--network coolify"
              echo "Coolify network detected"
            fi

            docker run -d \
              --name skaleclub-mail \
              --restart unless-stopped \
              $NETWORK_FLAG \
              -p 9001:9001 -p 25:25 -p 587:587 -p 993:993 \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              -e NODE_ENV=production \
              -e PORT=9001 \
              -e DEPLOY_VERSION="$DEPLOY_VERSION" \
              -e DEPLOYED_AT="$DEPLOYED_AT" \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}" \
              -e OUTLOOK_TOKEN_ENCRYPTION_KEY="${{ secrets.OUTLOOK_TOKEN_ENCRYPTION_KEY }}" \
              -e MAIL_DOMAIN="${{ secrets.MAIL_DOMAIN }}" \
              -e MAIL_HOST="mx.skale.club" \
              -e MAIL_TLS_CERT_PATH="/etc/letsencrypt/live/mx.skale.club/fullchain.pem" \
              -e MAIL_TLS_KEY_PATH="/etc/letsencrypt/live/mx.skale.club/privkey.pem" \
              -e APP_COMPANY_NAME="${{ secrets.APP_COMPANY_NAME }}" \
              -e APP_APPLICATION_NAME="${{ secrets.APP_APPLICATION_NAME }}" \
              -e SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              -e SMTP_USER="${{ secrets.SMTP_USER }}" \
              -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
              -e SMTP_FROM="${{ secrets.SMTP_FROM }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e SMTP_SUBMISSION_PORT=587 \
              -e MX_PORT=25 \
              -e IMAP_PORT=993 \
              -e ENABLE_MAIL_SERVER=true \
              --label "traefik.enable=true" \
              --label "traefik.docker.network=coolify" \
              --label "traefik.http.routers.skaleclub-mail.rule=Host(\`mail.skale.club\`)" \
              --label "traefik.http.routers.skaleclub-mail.entrypoints=https" \
              --label "traefik.http.routers.skaleclub-mail.tls=true" \
              --label "traefik.http.routers.skaleclub-mail.tls.certresolver=letsencrypt" \
              --label "traefik.http.services.skaleclub-mail.loadbalancer.server.port=9001" \
              skaleclub-mail:latest
            echo "::endgroup::"

            echo "::group::🏥 Health check"
            HEALTH_PASSED=false
            for i in $(seq 1 $HEALTH_CHECK_RETRIES); do
              sleep $HEALTH_CHECK_INTERVAL
              if curl -sf "$HEALTH_CHECK_URL" > /dev/null 2>&1; then
                HEALTH_PASSED=true; echo "✅ Passed on attempt $i"; break
              fi
              echo "Attempt $i/$HEALTH_CHECK_RETRIES…"
            done
            if [ "$HEALTH_PASSED" = "false" ]; then
              echo "❌ Health check failed"
              docker logs skaleclub-mail --tail 50 2>&1 || true
              # Rollback
              if docker images skaleclub-mail:previous --format "{{.ID}}" | grep -q .; then
                docker stop skaleclub-mail || true; docker rm -f skaleclub-mail || true
                docker run -d --name skaleclub-mail --restart unless-stopped \
                  $NETWORK_FLAG -p 9001:9001 -p 25:25 -p 587:587 -p 993:993 \
                  -v /etc/letsencrypt:/etc/letsencrypt:ro \
                  -e NODE_ENV=production -e PORT=9001 \
                  -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
                  -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                  skaleclub-mail:previous
                echo "⏪ Rolled back to previous"
              fi
              exit 1
            fi
            echo "::endgroup::"

            echo "::group::🧹 Cleanup"
            docker image prune -f
            docker builder prune -f --keep-storage=500MB || true
            echo "::endgroup::"

            echo "✅ DEPLOYED version $DEPLOY_VERSION at $DEPLOYED_AT"
