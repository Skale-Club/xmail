name: Host capacity diagnostics

# Read-only look at the production host, for when a deploy is refused at the
# `host-capacity` step (capacity() in scripts/ops/prepare-xmail-final-data-cutover.py)
# and SSH from a workstation is not available. Manual trigger only.
#
# This repository is public, so these logs are public: print numbers and process
# names only. Never print environment variables, command lines or client addresses.

on:
  workflow_dispatch:
    inputs:
      reclaim_swap:
        description: Move swapped pages back to RAM first (no restart; refuses unless 1 GB of RAM would remain)
        type: boolean
        default: false
      ssh_audit:
        description: Also print a read-only SSH audit (settings and counts, no addresses or keys)
        type: boolean
        default: false

permissions: {}

jobs:
  read-host-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Reclaim stale swap
        if: ${{ inputs.reclaim_swap }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            available=$(awk '/^MemAvailable:/{print int($2/1024)}' /proc/meminfo)
            used=$(awk '/^SwapTotal:/{t=$2} /^SwapFree:/{f=$2} END{print int((t-f)/1024)}' /proc/meminfo)
            echo "before: available ${available} MB, swap used ${used} MB"
            if [ $((available - used)) -lt 1024 ]; then
              echo "refused: less than 1 GB of RAM would remain" >&2
              exit 1
            fi
            for device in $(swapon --show=NAME --noheadings); do
              swapoff "$device"
              swapon "$device"
            done
            echo "swap reclaimed"

      - name: Read memory, swap, disk and top consumers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -u
            echo "== Deploy gate, same limits as capacity()"
            awk '/^MemAvailable:/{a=$2} /^SwapTotal:/{t=$2} /^SwapFree:/{f=$2} END{
              printf "MemAvailable %d MB (needs >= 768): %s\n", a/1024, (a>=786432?"ok":"FAIL");
              printf "Swap used %d MB of %d MB (needs <= 512): %s\n", (t-f)/1024, t/1024, (t-f<=524288?"ok":"FAIL")
            }' /proc/meminfo
            for path in /opt /tmp; do
              free_gb=$(df -BG --output=avail "$path" | tail -1 | tr -dc 0-9)
              echo "$path free ${free_gb} GB (needs >= 3)"
            done
            echo "/tmp filesystem: $(stat -f -c %T /tmp)"
            echo
            echo "== Memory"
            uptime
            free -m
            echo
            echo "== Containers by memory"
            docker stats --no-stream --format '{{.MemUsage}} {{.Name}}' | sort -hr | head -15
            echo
            echo "== Processes by resident memory (kB)"
            ps -eo rss,comm --sort=-rss | head -12
            echo
            echo "== Processes by swap (kB)"
            for f in /proc/[0-9]*; do
              s=$(awk '/^VmSwap/{print $2}' "$f/status" 2>/dev/null)
              if [ -n "${s:-}" ] && [ "$s" -gt 20000 ]; then echo "$s $(cat "$f/comm" 2>/dev/null)"; fi
            done | sort -rn | head -12
            echo
            echo "== SSH pressure, last 2 hours (counts only)"
            echo "beyond MaxStartups: $(journalctl -u ssh --since '2 hours ago' --no-pager 2>/dev/null | grep -c 'beyond MaxStartups')"
            echo "sessions accepted: $(journalctl -u ssh --since '2 hours ago' --no-pager 2>/dev/null | grep -c 'Accepted ')"
            echo "failed attempts: $(journalctl -u ssh --since '2 hours ago' --no-pager 2>/dev/null | grep -cE 'Failed password|Invalid user|Connection closed by authenticating')"
            echo "fail2ban: $(systemctl is-active fail2ban 2>/dev/null)"

      - name: Read SSH settings and session counts
        if: ${{ inputs.ssh_audit }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -u
            log=$(mktemp); keys=$(mktemp); trap 'rm -f "$log" "$keys"' EXIT
            journalctl -u ssh --since '24 hours ago' --no-pager -o cat > "$log" 2>/dev/null
            echo "== Effective sshd settings"
            sshd -T 2>/dev/null | grep -Ei '^(port|permitrootlogin|passwordauthentication|kbdinteractiveauthentication|pubkeyauthentication|maxstartups|maxauthtries|logingracetime|allowusers|allowgroups) '
            echo
            echo "== Authorized keys for root (numbers stand in for keys)"
            n=0
            while IFS= read -r line; do
              case "$line" in ''|'#'*) continue ;; esac
              n=$((n + 1))
              fp=$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')
              echo "$fp key#$n" >> "$keys"
            done < /root/.ssh/authorized_keys
            echo "total: $n"
            echo
            echo "== Accepted logins, 24 hours: method, user, key, source class, count, distinct sources"
            self=$(hostname -I)
            awk -v self="$self" -v keyfile="$keys" '
              BEGIN { while ((getline l < keyfile) > 0) { split(l, p, " "); alias[p[1]] = p[2] } }
              /^Accepted / {
                ip = $6; key = "none"
                if ($2 == "publickey") { key = alias[$NF]; if (key == "") key = "not-in-authorized_keys" }
                if (ip ~ /^127\./ || ip == "::1") c = "loopback"
                else if (index(" " self " ", " " ip " ")) c = "this-host"
                else if (ip ~ /^10\./ || ip ~ /^192\.168\./ || ip ~ /^172\.(1[6-9]|2[0-9]|3[01])\./) c = "private"
                else c = "public"
                g = $2 " " $4 " " key " " c
                count[g]++; if (!seen[g, ip]++) distinct[g]++
              }
              END { for (g in count) print g, count[g], distinct[g] }
            ' "$log" | sort
            echo
            echo "== Open sessions: source class, login day"
            who | awk '{ s = $NF; gsub(/[()]/, "", s); c = "public"; if (s ~ /^127\./ || s == "::1") c = "loopback"; else if (s ~ /^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)/) c = "private"; else if (s !~ /^[0-9a-f:.]+$/) c = "other"; print c, $3 }' | sort | uniq -c
            echo
            echo "== Failed activity, 24 hours"
            echo "invalid user: $(grep -c '^Invalid user' "$log")"
            echo "failed password: $(grep -c '^Failed password' "$log")"
            echo "root attempts failed: $(grep -cE '^Failed [a-z]+ for root' "$log")"
            echo "closed before auth: $(grep -cE 'Connection (closed|reset) by .*\[preauth\]' "$log")"
            echo "kex or banner errors: $(grep -cE 'kex_exchange_identification|banner exchange|Unable to negotiate' "$log")"
            echo "startups dropped: $(grep -cE 'MaxStartups|drop connection' "$log")"
            echo "distinct failing sources: $(grep -E '^(Invalid user|Failed password)' "$log" | grep -oE 'from [0-9a-f:.]+' | sort -u | wc -l)"
            echo
            echo "== Firewall and blockers"
            echo "ufw: $(ufw status 2>/dev/null | head -1)"
            echo "fail2ban installed: $(command -v fail2ban-client >/dev/null && echo yes || echo no)"
            echo "crowdsec installed: $(command -v crowdsec >/dev/null && echo yes || echo no)"
            echo "connections on port 22 now: $(ss -Htn state established '( sport = :22 )' | wc -l)"
