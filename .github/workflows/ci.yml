name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel any in-progress run on the same ref when a new push/PR update arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-lock-budget:
    name: Disposable owned backup restore lock budget
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Pull the existing pinned PostgreSQL image for isolated rehearsal
        run: docker pull postgres@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      - name: Reproduce old SQLSTATE and verify actual bounded restore protocol
        run: python3 -B scripts/ops/rehearse-xmail-owned-backup-locks.py
        env:
          XMAIL_OWNED_BACKUP_REHEARSAL: disposable-lock-budget
      - name: Reproduce PGDATA53100 and verify measured temporary capacity fix
        run: python3 -B scripts/ops/rehearse-xmail-owned-backup-locks.py
        env:
          XMAIL_OWNED_BACKUP_REHEARSAL: disposable-data-capacity
      - name: Detect real restored row and schema drift without exposing values
        run: python3 -B scripts/ops/rehearse-xmail-owned-backup-locks.py
        env:
          XMAIL_OWNED_BACKUP_REHEARSAL: disposable-manifest-drift

  lint-and-typecheck:
    name: Lint + tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Database rehearsal offline policy (no SSH, Docker or source database)
        run: |
          node --test scripts/ops/xmail-database-rehearsal.test.mjs
          node --test scripts/ops/import-private-postgres-candidate.test.mjs
          node --test scripts/ops/test-xmail-google-deploy.mjs
          bash -n scripts/ops/xmail-database-rehearsal.sh
          bash -n scripts/ops/xmail-database-protocol.sh
          bash -n scripts/ops/import-private-postgres-candidate.sh
          bash -n scripts/ops/prepare-xmail-runtime-roles.sh
          bash scripts/ops/xmail-database-rehearsal.sh --plan
          bash scripts/ops/import-private-postgres-candidate.sh --plan
          bash scripts/ops/prepare-xmail-runtime-roles.sh --plan
          python3 -m py_compile scripts/ops/probe-xmail-staging.py
          python3 scripts/ops/probe-xmail-staging.py --plan
          node scripts/ops/xmail-offsite-backup.mjs --self-test
          python3 -B -m unittest discover -s scripts/ops -p test_xmail_owned_backup.py -v
          python3 -B scripts/ops/xmail-owned-backup.py --plan
          python3 -B scripts/ops/install-xmail-owned-backup.py
          python3 -B -m unittest discover -s scripts/ops -p test_prepare_xmail_identity_controls.py -v
          python3 -B -m unittest discover -s scripts/ops -p test_xmail_owned_deploy.py -v
          python3 -B -m unittest discover -s scripts/ops -p test_prepare_xmail_final_data_cutover.py -v
          python3 -B scripts/ops/prepare-xmail-final-data-cutover.py --plan
          python3 -B -m unittest discover -s scripts/ops -p test_prepare_xmail_owned_pilot_rollout.py -v
          python3 -B scripts/ops/prepare-xmail-owned-pilot-rollout.py --plan
          python3 -B -m unittest discover -s scripts/ops -p test_prepare_xmail_owned_authority_cutover.py -v
          python3 -B scripts/ops/prepare-xmail-owned-authority-cutover.py --plan
          python3 -B scripts/ops/prepare-xmail-identity-controls.py

      - name: Lint (eslint --max-warnings 0)
        run: npm run lint

      - name: Type-check client (tsconfig.json)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Development isolation and identity policy tests (no database or Docker)
        run: npx vitest run --project server src/db/database-target.test.ts src/db/pool-budget.test.ts src/lib/development-auth.test.ts src/server/lib/__tests__/development-supabase.test.ts src/server/lib/__tests__/health-readiness.test.ts src/server/lib/__tests__/object-storage.test.ts src/server/lib/__tests__/owned-object-storage.test.ts src/server/lib/__tests__/native-identity-controls.test.ts src/server/lib/__tests__/crypto.test.ts src/server/lib/__tests__/remote-db-guard.test.ts src/server/jobs/__tests__/development-scheduler.test.ts src/server/lib/__tests__/api-auth-public-routes.test.ts src/server/lib/__tests__/api-auth-disabled-user.test.ts src/server/lib/identity/google-provider.test.ts src/server/lib/identity/google-adc-config.test.ts src/server/lib/identity/google-x509-access-token.test.ts src/server/lib/identity/owned-session.test.ts src/server/lib/identity/sql-timestamp.test.ts src/server/lib/identity/pilot-config.test.ts src/server/lib/identity/legacy-account-proof.test.ts src/server/lib/identity/existing-account-link.test.ts src/server/lib/identity/user-sync.test.ts src/server/lib/identity/owned-user-admin.test.ts src/server/lib/identity/owned-user-admin-runtime.test.ts src/server/lib/identity/browser-auth-authority.test.ts src/server/lib/identity/owned-stream.test.ts src/server/lib/identity/owned-stream-http.test.ts src/server/lib/identity/owned-stream-access.test.ts src/server/lib/mailbox-events.test.ts src/server/lib/inbox-events.test.ts src/server/routes/identity.test.ts --maxWorkers 1 --testTimeout 15000

      - name: Firebase document headers (local HTTP; no provider requests)
        run: npx vitest run --project server src/server/lib/identity/browser-headers.test.ts --maxWorkers 1

      - name: Owned identity browser policy tests (mocked provider; no SMS/network)
        run: npx vitest run --project client src/pages/IdentityPilot.test.tsx src/lib/owned-identity.late-link.test.tsx src/hooks/useMultiSession.identity.test.tsx src/lib/api-client.identity.test.tsx src/lib/browser-auth-authority.test.tsx src/hooks/useAuth.authority.test.tsx --maxWorkers 1

      - name: HTTP staging bootstrap policy (mocked SQL; no mail/jobs/external services)
        run: npx vitest run --project server src/server/staging-http.test.ts --maxWorkers 1

      - name: Type-check server (tsconfig.server.json)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Build (client + server)
        run: npm run build
        env:
          # Build-only placeholders so `vite build` doesn't fail on missing
          # VITE_* envs. Real values are injected at deploy time, not CI.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_APP_NAME: Xmail (CI)

      - name: Retain compiled isolated HTTP staging entry
        uses: actions/upload-artifact@v4
        with:
          name: xmail-staging-http-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/package.json
            dist/server/index.js
            dist/server/runtime-entry.js
            dist/server/staging-config.js
            dist/server/staging-http.js

  identity-store:
    name: Owned identity PostgreSQL foundation and HTTP pilot store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: xmail_identity_test
          # Disposable runner database, reachable only over runner loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d xmail_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rehearse additive identity migration and session revocation
        run: npx vitest run --project server src/server/lib/identity/postgres-store.integration.test.ts --maxWorkers 1
        env:
          XMAIL_IDENTITY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_IDENTITY_TEST_SENTINEL: xmail-owned-identity-ci
      - name: Verify owned user administration atomicity and fresh authorization
        run: npx vitest run --project server src/server/lib/identity/owned-user-admin.integration.test.ts --maxWorkers 1
        env:
          XMAIL_IDENTITY_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_IDENTITY_TEST_SENTINEL: xmail-owned-identity-ci
      - name: Rehearse exact-UUID identity controls import and ban preservation
        run: node --test scripts/ops/xmail-identity-controls.integration.mjs
        env:
          XMAIL_IDENTITY_CONTROL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_IDENTITY_CONTROL_TEST_SENTINEL: xmail-identity-controls-ci
      - name: Rehearse final data refresh atomicity (dedicated disposable databases; no provider or Docker)
        run: node --test scripts/ops/xmail-final-data-cutover.integration.mjs
        env:
          XMAIL_FINAL_DATA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_FINAL_DATA_TEST_SENTINEL: xmail-final-data-ci
      - name: Rehearse owned pilot controls and credential rotation (disposable databases; no provider or Docker)
        run: node --test scripts/ops/xmail-owned-pilot-rollout.integration.mjs
        env:
          XMAIL_OWNED_PILOT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_OWNED_PILOT_TEST_SENTINEL: xmail-owned-pilot-ci
      - name: Verify private candidate runtime and staging role privileges
        run: node --test scripts/ops/xmail-runtime-role.integration.mjs
        env:
          XMAIL_RUNTIME_ROLE_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/xmail_identity_test
          XMAIL_RUNTIME_ROLE_TEST_SENTINEL: xmail-runtime-role-ci
