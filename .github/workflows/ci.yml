name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel any in-progress run on the same ref when a new push/PR update arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + tsc + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint (eslint --max-warnings 0)
        run: npm run lint

      - name: Type-check client (tsconfig.json)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Type-check server (tsconfig.server.json)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Build (client + server)
        run: npm run build
        env:
          # Build-only placeholders so `vite build` doesn't fail on missing
          # VITE_* envs. Real values are injected at deploy time, not CI.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_APP_NAME: Skale Club Mail (CI)
